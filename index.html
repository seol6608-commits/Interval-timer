bar i{display:block;background:var(--accent);height:100%;width:0;transition:width .25s}.records-link{width:100%;border:0;background:white;border-radius:14px;padding:17px 14px;text-align:left;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:5px}.records-mini{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.state-chip{border-radius:999px;padding:5px 9px;font-size:11px;background:#e8f6ee;color:#2f8a62;font-weight:700}.state-chip.paused{background:#eff1f4;color:#798595}.overlay{position:fixed;inset:0;z-index:20;background:#15213180;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(100%,465px);max-height:90dvh;overflow:auto;border-radius:22px;background:white;padding:26px;box-shadow:0 20px 70px #1f28394d}.dialog h3{font-size:21px;margin-bottom:8px}.dialog .help{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:21px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:13px;font-weight:700}.field input,.field textarea{border:1px solid #dce2e9;border-radius:11px;padding:13px;background:white;width:100%;color:var(--ink)}.field textarea{resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.hidden{display:none!important}.record-row{border-bottom:1px solid var(--line);padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.record-title{font-weight:700;font-size:14px}.record-sub{font-size:12px;color:var(--muted);line-height:1.7;margin-top:4px}.tag{font-size:11px;font-weight:700;color:var(--green)}.tag.partial{color:#ac7c50}.diagnostic{font-size:13px;line-height:1.7;color:#526072;background:#f6f7f9;border-radius:12px;padding:12px;word-break:break-word}.pip-preview{width:300px;max-width:100%;display:block;border:1px solid #ebedf0;border-radius:10px;margin:10px auto;background:white}.tip{font-size:12px;line-height:1.65;color:var(--muted);margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#243247;color:#fff;padding:12px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:40;max-width:calc(100vw - 40px);font-size:13px}.muted-button{font-size:12px;border:0;background:transparent;color:#a1aab7;text-decoration:underline}.mobile-header{display:none}@media(max-width:940px){.shell{grid-template-columns:215px minmax(330px,1fr)}.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:22px}.right .sectionhead{grid-column:1/-1;margin-bottom:0}.right .stat{margin-bottom:0}.right .records-link{grid-column:1/-1}.main{min-height:625px}}@media(max-width:650px){.shell{display:flex;flex-direction:column}.mobile-header{display:block;padding:19px 20px 0}.brand{margin:0}.left{order:2;border-right:0;border-top:1px solid var(--line);padding:22px}.left>.brand{display:none}.main{order:1;min-height:unset;padding:27px 20px 38px}.main h2{font-size:21px}.dial{width:min(100%,340px);margin:14px 0 8px}.dial .clock{font-size:56px}.right{order:3;grid-template-columns:repeat(2,minmax(0,1fr));padding:22px}.right .stat:nth-of-type(3){grid-column:1/-1}.controls .btn{padding:13px 15px;min-width:0}.dialog{padding:22px}.cols{grid-template-columns:1fr}.footer-note{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="shell">
<aside class="side left"><div class="brand"><span class="brandmark">◴</span> Interval</div><div class="sectionhead"><h2>타이머 목록</h2></div><button id="addPreset" class="add"><b>＋</b> 새로운 타이머</button><div id="presets" class="presets"></div><p class="footer-note">타이머 설정은 이 기기의 브라우저에 저장됩니다.<br>여러 프리셋 중 하나만 실행할 수 있습니다.</p></aside>
<main class="main"><div class="mobile-header"><div class="brand"><span class="brandmark">◴</span> Interval</div></div><h2 id="currentName">반복 공부</h2><p id="currentSpec" class="subtitle">15분 × 3회 · 총 45분</p><div class="dial"><svg viewBox="0 0 340 340" role="img" aria-label="현재 회차 진행률"><circle class="track" cx="170" cy="170" r="146"/><circle id="dialProgress" class="progress" cx="170" cy="170" r="146"/></svg><div class="dial-inner"><div id="clock" class="clock">15:00</div><div id="phase" class="phase">1 / 3회차</div><div id="finish" class="finish">시작 대기 중</div></div></div><div class="controls"><button id="startPause" class="btn primary">▶ 시작</button><button id="reset" class="btn">↺ 초기화</button><button id="addMinute" class="btn">＋1분</button></div><div class="mini-actions"><button id="pipButton" class="ghost">▣ 미니 화면(PiP) 시험</button><button id="editSelected" class="ghost">⚙ 설정 수정</button></div><p class="status" id="status">타이머를 시작하세요.</p></main>
<aside class="side right"><div class="sectionhead"><h2>진행 현황</h2><span class="state-chip paused" id="stateBadge">대기</span></div><div class="stat"><div class="label">완료 회차</div><div id="completeCount" class="value">0 / 3</div></div><div class="stat"><div class="label">전체 남은 시간</div><div id="totalLeft" class="value">45:00</div></div><div class="stat"><div class="label">진행률</div><div id="pct" class="value">0%</div><div class="bar"><i id="progressBar"></i></div></div><button class="records-link" id="recordsButton"><span>오늘 기록<div class="records-mini" id="recordSum">아직 기록이 없습니다</div></span><span>›</span></button></aside>
</div>
<div id="dialogLayer" class="overlay hidden" role="presentation"><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<canvas id="pipCanvas" width="640" height="360" class="hidden"></canvas><video id="pipVideo" playsinline muted autoplay style="position:fixed;left:-9999px;top:0;width:320px;height:180px;pointer-events:none" aria-label="미니 타이머 비디오"></video>
<script>
(()=>{'use strict';
const KEY='interval.app.v1', PRESETS=[{id:'study',name:'반복 공부',minutes:15,repeats:3,color:'#e98b50'},{id:'break',name:'짧은 휴식',minutes:5,repeats:1,color:'#9ba6b2'},{id:'focus',name:'집중 세션',minutes:25,repeats:4,color:'#3b9d80'}];
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({presets:structuredClone(PRESETS),selected:'study',records:[],session:null});
let data;try{const parsed=JSON.parse(localStorage.getItem(KEY));data=parsed&&Array.isArray(parsed.presets)&&parsed.presets.length?parsed:fresh()}catch{data=fresh()}
const state=()=>data.session,selected=()=>data.presets.find(p=>p.id===data.selected)||data.presets[0],save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('저장 공간에 접근할 수 없습니다. Safari 설정을 확인하세요.')}};
let toastTimer, refreshTimer, lastRender=-1, pipStream=null, pipFrameTimer=null, pipStatus='시작 전', pipUpdateAt=0;
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3400)}
function seconds(n){n=Math.max(0,Math.ceil(n));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function duration(s){return s.totalSec+s.bonusSec}
function elapsed(s,now=Date.now()){return Math.max(0,s.elapsedMs+(s.running?Math.max(0,now-s.anchor):0))/1000}
function stat(now=Date.now()){const p=selected(),s=state(),length=p.minutes*60,total=s?duration(s):length*p.repeats,passed=s?clamp(elapsed(s,now),0,total):0;const complete=passed>=total?p.repeats:Math.min(p.repeats-1,Math.floor(passed/length));const phase=passed>=total?p.repeats:Math.min(p.repeats,Math.floor(passed/length)+1);const lastStart=length*(p.repeats-1);const leftPhase=passed>=total?0:passed>=lastStart?total-passed:length-(passed%length);const phasePct=passed>=total?1:passed>=lastStart?(passed-lastStart)/(total-lastStart):(passed%length)/length;return {p,s,length,total,passed,complete,phase,leftPhase,remaining:Math.max(0,total-passed),pct:total?Math.round(100*passed/total):0,phasePct}}
function renderPresets(){const list=$('presets');list.innerHTML='';for(const p of data.presets){const btn=document.createElement('button');btn.className='preset'+(p.id===data.selected?' active':'');btn.innerHTML=`<span class="dot" style="border-color:${esc(p.color)}"></span><span><div class="pname">${esc(p.name)}</div><div class="sub">${p.minutes}분 × ${p.repeats}회</div></span><span class="options" aria-hidden="true">›</span>`;btn.onclick=()=>selectPreset(p.id);list.append(btn)}}
function render(force=false){const t=Math.floor(Date.now()/300);if(!force&&t===lastRender)return;lastRender=t;const x=stat();const {p,s}=x;document.documentElement.style.setProperty('--accent',p.color);document.documentElement.style.setProperty('--accent-pale',p.id==='focus'?'#e8f7f1':'#fff0e6');$('currentName').textContent=p.name;$('currentSpec').textContent=`${p.minutes}분 × ${p.repeats}회 · 총 ${p.minutes*p.repeats}분`;$('clock').textContent=seconds(x.leftPhase);$('phase').textContent=`${x.phase} / ${p.repeats}회차`;$('finish').textContent=s?.running?`종료 예정 ${new Date(Date.now()+x.remaining*1000).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`:s?'일시정지 중':'시작 대기 중';$('completeCount').textContent=`${x.complete} / ${p.repeats}`;$('totalLeft').textContent=seconds(x.remaining);$('pct').textContent=`${x.pct}%`;$('progressBar').style.width=`${x.pct}%`;const circumference=2*Math.PI*146;$('dialProgress').style.strokeDasharray=String(circumference);$('dialProgress').style.strokeDashoffset=String(circumference*(1-x.phasePct));$('startPause').textContent=s?.running?'Ⅱ 일시정지':s?'▶ 재개':'▶ 시작';$('stateBadge').textContent=s?.running?'진행 중':s?'일시정지':'대기';$('stateBadge').classList.toggle('paused',!s?.running);$('status').textContent=s?.running?'실제 시각 기준으로 시간과 회차를 계산합니다.':s?'정지된 시간은 경과 시간에 포함되지 않습니다.':'시작 버튼을 눌러 타이머를 실행하세요.';renderRecordSum();}
function renderRecordSum(){const today=new Date().toLocaleDateString('sv-SE');const rows=data.records.filter(r=>new Date(r.start).toLocaleDateString('sv-SE')===today);const ms=rows.reduce((n,r)=>n+r.elapsedSec,0);$('recordSum').textContent=rows.length?`${rows.length}세션 · ${Math.round(ms/60)}분 기록`:'아직 기록이 없습니다'}
function finishIfNeeded(){const s=state();if(!s||!s.running)return;const x=stat();if(x.passed+0.001>=x.total){record('완료');data.session=null;save();render(true);renderPresets();toast('모든 회차를 완료했습니다. 기록을 저장했습니다.')}}
function record(status){const s=state();if(!s)return;const p=selected(),e=Math.min(elapsed(s),duration(s));if(e<1)return;data.records.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:p.name,minutes:p.minutes,repeats:p.repeats,completed:Math.min(p.repeats,Math.floor(e/(p.minutes*60))),elapsedSec:Math.round(e),start:s.startedAt,end:Date.now(),status});data.records=data.records.slice(0,500)}
function startPause(){finishIfNeeded();const s=state();if(!s){const p=selected();data.session={presetId:p.id,startedAt:Date.now(),anchor:Date.now(),elapsedMs:0,running:true,totalSec:p.minutes*p.repeats*60,bonusSec:0}}else if(s.running){s.elapsedMs+=Math.max(0,Date.now()-s.anchor);s.running=false}else{s.anchor=Date.now();s.running=true}save();render(true)}
function reset(){if(state()&&elapsed(state())>0)record('중단');data.session=null;save();render(true);toast('타이머를 초기화했습니다. 진행된 시간은 중단 기록으로 남겼습니다.')}
function addMinute(){const p=selected();const s=state();if(!s){toast('타이머 시작 후 1분 연장이 가능합니다.');return} s.bonusSec+=60;save();render(true);toast('전체 시간에 1분을 추가했습니다.')}
function selectPreset(id){if(id===data.selected)return;if(state()&&elapsed(state())>0){if(!confirm('진행 중인 타이머를 중단하고 다른 타이머를 선택할까요?'))return;record('중단')}data.selected=id;data.session=null;save();renderPresets();render(true)}
const dialog=(html)=>{$('dialog').innerHTML=html;$('dialogLayer').classList.remove('hidden');const b=$('closeDialog');if(b)b.onclick=closeDialog};function closeDialog(){$('dialogLayer').classList.add('hidden');$('dialog').innerHTML=''}$('dialogLayer').onclick=e=>{if(e.target===$('dialogLayer'))closeDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
function editPreset(existing){const p=existing||{name:'',minutes:15,repeats:3,color:'#e98b50'};dialog(`<h3 id="dialogTitle">${existing?'타이머 수정':'새 타이머'}</h3><p class="help">설정한 시간을 횟수만큼 자동 반복합니다.</p><form id="presetForm"><div class="field"><label for="pName">타이머 이름</label><input id="pName" required maxlength="28" value="${esc(p.name)}" placeholder="예: 독서"></div><div class="cols"><div class="field"><label for="pMinutes">반복 간격 (분)</label><input id="pMinutes" type="number" required min="1" max="720" step="1" value="${p.minutes}"></div><div class="field"><label for="pRepeats">반복 횟수</label><input id="pRepeats" type="number" required min="1" max="99" step="1" value="${p.repeats}"></div></div><div class="field"><label for="pColor">강조 색상</label><input id="pColor" type="color" value="${p.color}" style="height:48px;padding:5px"></div><div class="dialog-foot"><button type="button" class="btn" id="closeDialog">취소</button><button type="submit" class="btn primary">저장</button></div></form>${existing?'<button class="muted-button" id="deletePreset" style="margin-top:14px">이 타이머 삭제</button>':''}`);$('presetForm').onsubmit=e=>{e.preventDefault();const name=$('pName').value.trim(),minutes=Number($('pMinutes').value),repeats=Number($('pRepeats').value),color=$('pColor').value;if(!name||!Number.isInteger(minutes)||minutes<1||minutes>720||!Number.isInteger(repeats)||repeats<1||repeats>99){toast('올바른 설정을 입력해주세요.');return}if(existing){if(state()&&data.selected===existing.id){toast('진행 중이거나 일시정지된 타이머는 초기화 후 수정할 수 있습니다.');return}Object.assign(existing,{name,minutes,repeats,color})}else{const id='p'+Date.now();data.presets.push({id,name,minutes,repeats,color});data.selected=id}save();renderPresets();render(true);closeDialog()};if(existing){$('deletePreset').onclick=()=>{if(data.presets.length<=1){toast('최소 한 개의 타이머는 필요합니다.');return}if(state()&&data.selected===existing.id){toast('실행 중인 타이머는 삭제할 수 없습니다.');return}if(!confirm('선택한 프리셋을 삭제할까요? 과거 기록은 유지됩니다.'))return;data.presets=data.presets.filter(x=>x.id!==existing.id);if(data.selected===existing.id)data.selected=data.presets[0].id;save();renderPresets();render(true);closeDialog()}}}
function recordsDialog(){const rows=data.records.map(r=>{const dt=new Date(r.start).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});return `<div class="record-row"><div><div class="record-title">${esc(r.name)}</div><div class="record-sub">${dt} · ${r.minutes}분 × ${r.repeats}회 · 실제 ${seconds(r.elapsedSec)}<br>완료 회차 ${r.completed}/${r.repeats}</div></div><span class="tag ${r.status==='완료'?'':'partial'}">${r.status}</span></div>`}).join('');dialog(`<h3 id="dialogTitle">타이머 기록</h3><p class="help">완료 및 중단한 세션을 이 기기에 저장합니다.</p><div style="max-height:48vh;overflow:auto">${rows||'<p style="color:#8793a3">아직 저장된 기록이 없습니다.</p>'}</div><div class="dialog-foot"><button class="btn" id="csvExport" type="button">CSV 내보내기</button><button class="btn primary" id="closeDialog">닫기</button></div>`);$('csvExport').onclick=exportCSV}
function exportCSV(){const header=['상태','타이머','시작시각','종료시각','설정분','반복횟수','완료횟수','실제초'];const csv=[header,...data.records.map(r=>[r.status,r.name,new Date(r.start).toISOString(),new Date(r.end).toISOString(),r.minutes,r.repeats,r.completed,r.elapsedSec])].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='interval-records.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function drawPip(){const canvas=$('pipCanvas'),ctx=canvas.getContext('2d'),x=stat();if(!ctx)return;ctx.fillStyle='#fff';ctx.fillRect(0,0,640,360);ctx.fillStyle='#243247';ctx.textAlign='left';ctx.font='600 32px -apple-system, sans-serif';ctx.fillText('Interval',52,70);ctx.textAlign='right';ctx.font='600 29px -apple-system, sans-serif';ctx.fillStyle=x.p.color;ctx.fillText(`${x.phase} / ${x.p.repeats}회차`,590,70);ctx.fillStyle='#243247';ctx.textAlign='center';ctx.font='bold 112px -apple-system, sans-serif';ctx.fillText(seconds(x.leftPhase),320,228);ctx.fillStyle='#eaeef2';roundRect(ctx,52,291,536,11,6);ctx.fill();ctx.fillStyle=x.p.color;const width=536*x.phasePct;if(width>0){roundRect(ctx,52,291,Math.max(3,width),11,6);ctx.fill()}pipUpdateAt=Date.now()}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}
function pipInfo(){const video=$('pipVideo');const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;return {standalone:isStandalone,canvas:typeof $('pipCanvas').captureStream==='function',webkit:typeof video.webkitSetPresentationMode==='function',standard:typeof video.requestPictureInPicture==='function',ready:video.readyState,mode:video.webkitPresentationMode||'미확인'}}
function pipDialog(message=''){const info=pipInfo();dialog(`<h3 id="dialogTitle">PiP 미니 타이머 시험</h3><p class="help">아이패드 Safari에서 미니 화면을 띄운 뒤 다른 앱으로 이동해 숫자가 실제로 갱신되는지 확인해주세요.</p><canvas id="pipPreview" class="pip-preview" width="640" height="360"></canvas><div class="diagnostic" id="pipInfo">${message?'<b>'+esc(message)+'</b><br>':''}실행 환경: ${info.standalone?'홈 화면 앱(PWA)':'Safari/브라우저'}<br>Canvas 영상 생성: ${info.canvas?'지원':'미지원'}<br>Safari PiP API: ${info.webkit?'존재':'없음'}<br>표준 PiP API: ${info.standard?'존재':'없음'}<br>상태: ${esc(pipStatus)}</div><p class="tip">주의: PiP 진입에 성공해도 다른 앱에서 시간 숫자가 계속 바뀌는지는 별도 검증이 필요합니다. iPadOS는 백그라운드 JavaScript 실행을 제한할 수 있습니다.</p><div class="dialog-foot"><button class="btn" id="closeDialog">닫기</button><button class="btn primary" id="launchPip">PiP 실행 시험</button></div>`);drawPip();$('pipPreview').getContext('2d').drawImage($('pipCanvas'),0,0);$('launchPip').onclick=launchPip}
async function launchPip(){const video=$('pipVideo'),can=$('pipCanvas');if(!can.captureStream){pipStatus='Canvas captureStream 미지원';pipDialog('이 브라우저에서 캔버스 영상을 만들 수 없습니다.');return}try{drawPip();if(!pipStream){pipStream=can.captureStream(5);video.srcObject=pipStream}video.muted=true;video.playsInline=true;await video.play();const supportsWebkit=video.webkitSupportsPresentationMode?.('picture-in-picture')===true;if(supportsWebkit){video.webkitSetPresentationMode('picture-in-picture');pipStatus='Safari PiP 진입 요청 완료';toast('PiP를 요청했습니다. 창이 나타나는지 확인하세요.')}else if(typeof video.requestPictureInPicture==='function'&&document.pictureInPictureEnabled){await video.requestPictureInPicture();pipStatus='표준 PiP 진입 완료';toast('PiP 실행 요청이 성공했습니다.')}else{pipStatus='동적 Canvas 영상 PiP 사용 불가';toast('현재 환경은 이 영상의 PiP를 지원하지 않습니다.')}if(!$('dialogLayer').classList.contains('hidden'))pipDialog()}catch(err){pipStatus=`실패: ${err.name||'Error'} — ${err.message||'알 수 없는 오류'}`;pipDialog(pipStatus)}}
$('pipVideo').addEventListener('webkitpresentationmodechanged',()=>{pipStatus='Safari 표시 모드: '+$('pipVideo').webkitPresentationMode});$('pipVideo').addEventListener('enterpictureinpicture',()=>{pipStatus='PiP 진입 성공'});$('pipVideo').addEventListener('leavepictureinpicture',()=>{pipStatus='PiP 종료'});
$('addPreset').onclick=()=>editPreset(null);$('editSelected').onclick=()=>editPreset(selected());$('startPause').onclick=startPause;$('reset').onclick=reset;$('addMinute').onclick=addMinute;$('recordsButton').onclick=recordsDialog;$('pipButton').onclick=()=>pipDialog();
// Local data can outlive page suspension. The real elapsed time is always computed from Date.now().
if(state()){const s=state();const p=data.presets.find(p=>p.id===s.presetId);if(p)data.selected=p.id;else data.session=null}
renderPresets();finishIfNeeded();render(true);drawPip();refreshTimer=setInterval(()=>{finishIfNeeded();render();drawPip();const preview=$('pipPreview');if(preview)preview.getContext('2d').drawImage($('pipCanvas'),0,0)},250);document.addEventListener('visibilitychange',()=>{finishIfNeeded();render(true);drawPip()});window.addEventListener('pageshow',()=>{finishIfNeeded();render(true)});window.addEventListener('beforeunload',save);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
