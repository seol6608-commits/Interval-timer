<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Interval">
  <meta name="description" content="Interval 1.3.1 — 6종 테마 및 오프라인 반복 타이머">
  <title>Interval 1.3.1 — 반복 타이머</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=1.3.1">
  <script src="app.js?v=1.3.1" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="side left" aria-label="타이머 프리셋">
      <div class="brand"><span class="brandmark" aria-hidden="true">◴</span><span>Interval<small>1.3.1</small></span></div>
      <button id="themeButton" type="button" class="theme-launch" aria-label="테마 선택"><span class="theme-swatch" aria-hidden="true"></span><span>테마 <strong id="themeName">화이트</strong></span><span aria-hidden="true">⌄</span></button>
      <div class="sectionhead"><h2>타이머 목록</h2><span id="presetCount" class="count">3개</span></div>
      <button type="button" id="addPreset" class="add"><b aria-hidden="true">＋</b> 새로운 타이머</button>
      <div id="presets" class="presets" aria-label="저장된 타이머"></div>
      <p class="footer-note">타이머를 터치하면 선택됩니다.<br>우측 <strong>⋯</strong> 버튼에서 수정·복제·삭제·순서 변경이 가능합니다.</p>
      <p class="storage-note">설정과 기록은 현재 기기에 저장됩니다.</p>
      <p id="offlineStatus" class="offline-status" data-state="pending" role="status" aria-live="polite">오프라인 파일 저장 중</p>
    </aside>

    <main class="main">
      <div class="mobile-header"><div class="brand"><span class="brandmark" aria-hidden="true">◴</span><span>Interval<small>1.3.1</small></span><button id="mobileThemeButton" class="mobile-theme" aria-label="테마 선택" type="button">◐ 테마</button></div></div>
      <h1 id="currentName">기본 타이머</h1>
      <p id="currentSpec" class="subtitle">15분 × 3회 · 총 45분</p>
      <div class="dial">
        <svg viewBox="0 0 340 340" role="img" aria-label="현재 회차 진행률">
          <circle class="track" cx="170" cy="170" r="146"/>
          <circle id="dialProgress" class="progress" cx="170" cy="170" r="146"/>
        </svg>
        <div class="dial-inner" aria-live="off">
          <div id="clock" class="clock">15:00</div>
          <div id="phase" class="phase">1 / 3회차</div>
          <div id="finish" class="finish">시작 대기 중</div>
        </div>
      </div>
      <div class="controls" aria-label="타이머 조작">
        <div class="control-primary-row">
          <button id="startPause" class="btn primary" type="button">▶ 시작</button>
          <button id="skipPhase" class="btn skip" type="button" title="남은 시간을 건너뛰고 다음 회차로 이동">⏭ 다음 회차</button>
        </div>
        <div class="control-secondary-row">
          <button id="reset" class="btn" type="button">↺ 초기화</button>
          <button id="addMinute" class="btn" type="button">＋1분</button>
        </div>
      </div>
      <div class="mini-actions">
        <button id="pipButton" class="ghost" type="button">▣ 미니 화면(PiP)</button>
        <button id="editSelected" class="ghost" type="button">⚙ 현재 타이머 수정</button>
      </div>
      <p class="status" id="status">타이머를 시작하세요.</p>
    </main>

    <aside class="side right" aria-label="진행 현황 및 기록">
      <div class="sectionhead"><h2>진행 현황</h2><span class="state-chip paused" id="stateBadge">대기</span></div>
      <div class="stat"><div class="label">완료 회차</div><div id="completeCount" class="value">0 / 3</div></div>
      <div class="stat"><div class="label">전체 남은 시간</div><div id="totalLeft" class="value">45:00</div></div>
      <div class="stat"><div class="label">회차 진행률</div><div id="pct" class="value">0%</div><div class="bar"><i id="progressBar"></i></div></div>
      <div class="stat small-stat"><div class="label">정상 완료 · 건너뜀</div><div id="roundSummary" class="value">0회 · 0회</div><div class="stat-detail" id="actualTime">실제 실행 00:00</div></div>
      <button type="button" class="records-link" id="recordsButton"><span>오늘 기록<span class="records-mini" id="recordSum">아직 기록이 없습니다</span></span><span aria-hidden="true">›</span></button>
    </aside>
  </div>

  <div id="dialogLayer" class="overlay hidden" role="presentation">
    <section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></section>
  </div>
  <div id="updateBanner" class="update-banner hidden" role="status" aria-live="polite"><span>새 버전이 준비되었습니다.</span><button id="updateNow" type="button">업데이트</button><button id="dismissUpdate" type="button" aria-label="알림 닫기">×</button></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <canvas id="pipCanvas" width="640" height="360" class="hidden" aria-hidden="true"></canvas>
  <video id="pipVideo" playsinline muted autoplay style="position:fixed;left:-9999px;top:0;width:320px;height:180px;pointer-events:none" aria-label="PiP 타이머 영상"></video>
</body>
</html>
